:root{--bg:#0b0b0d;--fg:#eee8dd;--mut:#aaa198;--red:#b52b30;box-sizing:border-box}*{box-sizing:inherit}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:Georgia,"Times New Roman",serif}#c{position:fixed;inset:0;width:100%;height:100%;display:block}#intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(8,8,10,.91)}#intro section{max-width:620px}#intro h1{font-size:clamp(34px,8vw,70px);font-weight:400;letter-spacing:.03em;margin:0 0 16px}#intro p{color:var(--mut);line-height:1.65;margin:0 auto 12px;max-width:52ch}#loading-status{min-height:22px;color:#d99b9d;font:12px system-ui,sans-serif;margin:0 auto 20px}#enter-button{display:inline-block;border:1px solid var(--red);padding:12px 24px;font-weight:400;opacity:.45;cursor:wait;transition:opacity .2s,background .2s}#enter-button.ready{opacity:1;cursor:pointer;background:#32191b}#hint{position:fixed;z-index:3;top:10px;left:0;right:0;text-align:center;color:#aaa198;font:12px system-ui,sans-serif;pointer-events:none}#info{position:fixed;z-index:4;left:0;right:0;bottom:0;padding:18px 20px 24px;background:linear-gradient(transparent,rgba(7,7,8,.94) 36%);opacity:0;transition:opacity .25s;pointer-events:none}#info.on{opacity:1}#info h2{margin:0;font-weight:400;font-size:23px}#info em{display:block;color:var(--mut);margin:3px 0 7px}#info p{margin:0;max-width:68ch;line-height:1.5;font-size:15px}#joystick{position:fixed;z-index:5;display:none;width:118px;height:118px;transform:translate(-50%,-50%);pointer-events:none;opacity:.58}.joy-on{display:block!important}.joy-base{position:absolute;inset:0;border:1px solid #eee;border-radius:50%;background:#1118;box-shadow:inset 0 0 0 18px #eee1}.joy-stick{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border:1px solid #eee;border-radius:50%;background:#eee4}

18px 15px 28px}.hist-compare{grid-template-columns:1fr}}
#journey-open{width:100%;margin-top:12px;border:1px solid #b52b30;background:#32191b;color:#fff;padding:10px;cursor:pointer;font:13px Georgia,serif}.journey-panel{position:fixed;z-index:30;inset:0;background:#08090ceF;display:none;grid-template-rows:auto 1fr auto;padding:18px}.journey-panel.open{display:grid}.journey-head{display:flex;justify-content:space-between;align-items:start;gap:15px}.journey-head h2{margin:0;font-size:28px;font-weight:400}.journey-head p{margin:5px 0;color:#aaa198;font:12px/1.4 system-ui,sans-serif}.journey-close{background:#111;color:#fff;border:1px solid #b52b30;padding:8px 10px;cursor:pointer}.journey-stage{position:relative;min-height:0;margin:10px 0;border:1px solid #3f3034;background:#0d1015;overflow:hidden}.journey-stage canvas{display:block;width:100%;height:100%}.journey-caption{display:flex;gap:12px;align-items:center;min-height:64px;color:#d8d0c7;font:13px/1.45 Georgia,serif}.journey-caption b{color:#e2a5a7;font-size:18px}.journey-caption span{max-width:70ch}.journey-step{border:1px solid #b52b30;background:#32191b;color:#fff;padding:9px 13px;cursor:pointer;font:13px Georgia,serif;white-space:nowrap}@media(max-width:650px){.journey-panel{padding:10px}.journey-head h2{font-size:22px}.journey-caption{align-items:start;flex-wrap:wrap}.journey-step{order:-1}}</style></head><body><canvas id="c"></canvas><div id="joystick"><div class="joy-base"><div class="joy-stick"></div></div></div><div id="hint">Unten links berühren: Joystick zum Gehen. Rechts ziehen: umschauen. Am PC: WASD und Maus.</div><div id="info"><h2></h2><em></em><p></p></div><div id="intro"><section><h1>Museum der Überlieferung</h1><p>Die Ausstellung wird vollständig vorbereitet. Erst wenn Raum, Wandtafeln und alle 3D-Modelle geladen sind, kannst du eintreten.</p><div id="loading-status" aria-live="polite">3D-Modelle werden geladen … 0/3</div><b id="enter-button" aria-disabled="true">Bitte warten …</b></section></div>

const T=THREE,canvas=document.getElementById('c'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=T.sRGBEncoding;const scene=new T.Scene();scene.background=new T.Color(0x08090c);scene.fog=new T.FogExp2(0x101014,.018);const camera=new T.PerspectiveCamera(75,1,.1,80);const clock=new T.Clock();

	function wallPanel(title,rows,x,y,z,w=7,h=4.7){const cv=document.createElement('canvas');cv.width=1200;cv.height=820;const c=cv.getContext('2d');c.fillStyle='#121014';c.fillRect(0,0,1200,820);c.strokeStyle='#b52b30';c.lineWidth=8;c.strokeRect(18,18,1164,784);c.fillStyle='#eee8dd';c.font='bold 46px Georgia';c.fillText(title,55,78);c.strokeStyle='#7b4a4a';c.lineWidth=2;c.beginPath();c.moveTo(55,105);c.lineTo(1145,105);c.stroke();let yy=148;rows.forEach(r=>{c.fillStyle='#dba3a3';c.font='bold 22px Georgia';c.fillText(r.d,55,yy);c.fillStyle='#eee8dd';c.font='24px Georgia';const words=r.t.split(' ');let line='';let lines=[];words.forEach(word=>{const test=line?line+' '+word:word;if(c.measureText(test).width>850){lines.push(line);line=word}else line=test});if(line)lines.push(line);lines.slice(0,2).forEach((line,i)=>c.fillText(line,255,yy+i*29));yy+=Math.max(58,lines.slice(0,2).length*29+24)});const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:new T.CanvasTexture(cv),transparent:true,depthWrite:false}));m.position.set(x,y,z);return scene.add(m)}

box(32,.2,42,dark,0,0,-9);box(32,6,.25,red,0,3,-30);box(.25,6,42,red,-16,3,-9);box(.25,6,42,red,16,3,-9);label('MUSEUM DER ÜBERLIEFERUNG',0,5.2,-29.8,12,1);label('DER WEG DES TAGEBUCHS',0,4.35,-29.72,8,.7);
const lights=[[-10,3,-5,0xb52b30],[0,3,-16,0xd4b69e],[10,3,-5,0x9b7e75]];lights.forEach(a=>{const l=new T.PointLight(a[3],2.2,12);l.position.set(a[0],a[1],a[2]);scene.add(l)});const P=[[0,1,1.2],[-10,-5,1.1],[0,-16,1.1],[10,-5,1.1]];

function displayLabel(text,x,z,w=4){label(text,x,3.25,z,w,.52,Math.PI)}
	const enterButton=document.getElementById('enter-button'),loadingStatus=document.getElementById('loading-status');let loadedAssets=0;function assetLoaded(){loadedAssets++;loadingStatus.textContent=loadedAssets<3?`3D-Modelle werden geladen … ${loadedAssets}/3`:'Ausstellung vollständig geladen · bereit zum Eintreten';if(loadedAssets===3){enterButton.textContent='Eintreten';enterButton.classList.add('ready');enterButton.setAttribute('aria-disabled','false');enterButton.style.cursor='pointer'}}function loadMuseumModel(path,x,z,scale,info){loader.load(path,gltf=>{const model=gltf.scene;model.position.set(x,0,z);model.scale.setScalar(scale);model.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=true}});scene.add(model);const bounds=new T.Box3().setFromObject(model);model.position.y+=.22-bounds.min.y;model.userData.info=info;objects.push(model);assetLoaded()},undefined,err=>{loadingStatus.textContent='Ein 3D-Modell konnte nicht geladen werden. Bitte Seite neu laden.';console.error('3D-Modell konnte nicht geladen werden:',path,err)})}

const keys={},ptr={},move={x:0,y:0},pos=new T.Vector3(0,1.6,4),joy=document.getElementById('joystick');let yaw=0,pitch=0;addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function joyReset(){move.x=move.y=0;joy.classList.remove('joy-on');joy.querySelector('.joy-stick').style.transform='translate(0,0)'}function isJoy(e){return e.pointerType==='touch'&&e.clientX<innerWidth*.5&&e.clientY>innerHeight*.5}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const m=isJoy(e);ptr[e.pointerId]={m,lx:e.clientX,ly:e.clientY,sx:e.clientX,sy:e.clientY};if(m){joy.style.left=e.clientX+'px';joy.style.top=e.clientY+'px';joy.classList.add('joy-on')}});canvas.addEventListener('pointermove',e=>{const p=ptr[e.pointerId];if(!p)return;const dx=e.clientX-p.sx,dy=e.clientY-p.sy;if(p.m){move.x=clamp(dx/50,-1,1);move.y=clamp(dy/50,-1,1);joy.querySelector('.joy-stick').style.transform=`translate(${move.x*45}px,${move.y*45}px)`}else{yaw-=(e.clientX-p.lx)*.005;pitch=clamp(pitch-(e.clientY-p.ly)*.005,-.9,.9)}p.lx=e.clientX;p.ly=e.clientY});['pointerup','pointercancel','lostpointercapture'].forEach(n=>canvas.addEventListener(n,e=>{if(ptr[e.pointerId]?.m)joyReset();delete ptr[e.pointerId]}));
const info=document.getElementById('info');let current=null;enterButton.onclick=()=>{if(loadedAssets===3)document.getElementById('intro').style.display='none'};function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-move.y,sd=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+move.x,sp=4*dt,sn=Math.sin(yaw),cs=Math.cos(yaw);pos.x+=(-sn*f+cs*sd)*sp;pos.z+=(-cs*f-sn*sd)*sp;pos.x=clamp(pos.x,-14.5,14.5);pos.z=clamp(pos.z,-28.5,3.2);camera.position.set(pos.x,1.6+Math.sin(t*5)*((f||sd)?.015:0),pos.z);camera.rotation.set(pitch,yaw,0,'YXZ');objects.forEach((g,i)=>{g.rotation.y=Math.sin(t*.45+i)*.04;const d=Math.hypot(pos.x-g.position.x,pos.z-g.position.z);if(d<2.5&&current!==g){current=g;info.querySelector('h2').textContent=g.userData.info[0];info.querySelector('em').textContent=g.userData.info[1];info.querySelector('p').textContent=g.userData.info[2];info.classList.add('on')}if(d>=2.5&&current===g){current=null;info.classList.remove('on')}});renderer.render(scene,camera)}loop();</script></body></html>
